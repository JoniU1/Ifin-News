name: Build feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.keepalive'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run Hebrew aggregator
        run: python aggregate.py
      - name: Run English aggregator
        run: python aggregate_en.py || echo "English aggregator failed (non-fatal)"
      - name: Prepare site directory
        run: |
          mkdir -p _site/en
          cp feed.xml _site/feed.xml
          cp index.html _site/index.html
          if [ -f en.html ]; then cp en.html _site/en/index.html; fi
          if [ -f en-feed.xml ]; then cp en-feed.xml _site/en/feed.xml; fi
