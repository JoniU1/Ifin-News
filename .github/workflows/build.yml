name: Build feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.keepalive'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run aggregator
        run: python aggregate.py
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp feed.xml _site/feed.xml
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Keep-alive (only on the 1st of each month)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H%M)" \< "0030" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keep-alive" || echo "nothing to commit"
            git push || echo "push skipped"
          else
            echo "not keep-alive window, skipping"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
